name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portuguese-catalog-manager-application (2)

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portuguese-catalog-manager-application (2)/package-lock.json
      # `npm ci` (e não `npm install`) porque o repositório ainda versiona
      # node_modules: o install enxerga os pacotes presentes e não refaz os
      # atalhos de node_modules/.bin, que chegam sem permissão de execução.
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Guardar o build
        uses: actions/upload-artifact@v5
        with:
          name: catalog-dist
          path: portuguese-catalog-manager-application (2)/dist
          retention-days: 7
