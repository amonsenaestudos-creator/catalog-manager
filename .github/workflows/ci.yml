name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portuguese-catalog-manager-application (2)

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build de produção
        run: npm run build
      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: catalog-dist
          path: portuguese-catalog-manager-application (2)/dist
          retention-days: 7
